<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Agent Icon Source</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1024px;
        height: 1024px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .mark {
        position: relative;
        width: 820px;
        height: 820px;
        filter: drop-shadow(0 34px 40px rgba(0, 12, 22, 0.34));
      }

      .chip {
        position: absolute;
        inset: 96px;
        overflow: hidden;
        border: 24px solid #dffcff;
        border-radius: 176px;
        background:
          radial-gradient(circle at 72% 25%, rgba(255, 206, 56, 0.15), transparent 28%),
          linear-gradient(145deg, #152433 0%, #081019 72%);
        box-shadow:
          inset 0 0 0 10px #24d7e6,
          inset 0 0 64px rgba(36, 215, 230, 0.22);
      }

      .chip::before,
      .chip::after {
        content: '';
        position: absolute;
        width: 240px;
        height: 240px;
        border: 14px solid rgba(36, 215, 230, 0.22);
        border-radius: 50%;
      }

      .chip::before {
        top: -112px;
        right: -88px;
      }

      .chip::after {
        bottom: -136px;
        left: -84px;
      }

      .pin {
        position: absolute;
        border-radius: 18px;
        background: #24d7e6;
        box-shadow: 0 0 18px rgba(36, 215, 230, 0.45);
      }

      .pin.top,
      .pin.bottom {
        width: 44px;
        height: 116px;
      }

      .pin.left,
      .pin.right {
        width: 116px;
        height: 44px;
      }

      .pin.top {
        top: 24px;
      }

      .pin.bottom {
        bottom: 24px;
      }

      .pin.left {
        left: 24px;
      }

      .pin.right {
        right: 24px;
      }

      .p1.top,
      .p1.bottom {
        left: 246px;
      }

      .p2.top,
      .p2.bottom {
        right: 246px;
      }

      .p1.left,
      .p1.right {
        top: 246px;
      }

      .p2.left,
      .p2.right {
        bottom: 246px;
      }

      .n {
        position: absolute;
        inset: 205px 210px;
      }

      .n-left,
      .n-right,
      .n-diagonal {
        position: absolute;
        border-radius: 42px;
        background: #f4feff;
        box-shadow: 0 0 24px rgba(244, 254, 255, 0.28);
      }

      .n-left,
      .n-right {
        top: 0;
        width: 76px;
        height: 410px;
      }

      .n-left {
        left: 0;
      }

      .n-right {
        right: 0;
      }

      .n-diagonal {
        top: 28px;
        left: 167px;
        width: 78px;
        height: 370px;
        transform: rotate(-35deg);
        background: #24d7e6;
      }

      .core {
        position: absolute;
        top: 348px;
        left: 542px;
        width: 62px;
        height: 62px;
        border: 12px solid #fff3b8;
        border-radius: 50%;
        background: #ffce38;
        box-shadow: 0 0 30px rgba(255, 206, 56, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="mark" role="img" aria-label="Nova N-shaped agent chip">
      <span class="pin top p1"></span>
      <span class="pin top p2"></span>
      <span class="pin right p1"></span>
      <span class="pin right p2"></span>
      <span class="pin bottom p1"></span>
      <span class="pin bottom p2"></span>
      <span class="pin left p1"></span>
      <span class="pin left p2"></span>
      <div class="chip">
        <div class="n">
          <span class="n-left"></span>
          <span class="n-diagonal"></span>
          <span class="n-right"></span>
        </div>
        <span class="core"></span>
      </div>
    </div>
  </body>
</html>
